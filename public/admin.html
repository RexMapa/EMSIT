<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EMSIT — Team inbox</title><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script><link rel="stylesheet" href="/premium.css"><script defer src="/motion.js"></script></head><body class="admin-page"><header><a class="logo" href="/"><img src="/assets/emsit-dark-brown-wordmark.png" alt="EMSIT" width="2172" height="724"></a><span class="eyebrow">TEAM INBOX</span><button class="nav-cta" id="logout" hidden>Sign out ↗</button></header><main class="admin-main"><section id="login-panel" class="contact-card login-card" hidden><p class="eyebrow">PRIVATE WORKSPACE</p><h1>Welcome back.</h1><p>Sign in to review applications, quotation requests, and staffing inquiries.</p><form id="login-form"><label>Admin password<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button type="submit" class="button gold">Sign in <span>↗</span></button><p role="status" id="login-status"></p></form></section><section id="inbox" hidden><div class="inbox-heading"><div><h1>Form submissions</h1></div><button class="button outline" id="refresh">Refresh ↻</button></div><div class="inbox-tabs" role="group" aria-label="Submission forms">
  <button type="button" class="button outline" data-kind="apply" aria-pressed="true">Apply</button>
  <button type="button" class="button outline" data-kind="quotation" aria-pressed="false">Quotation</button>
  <button type="button" class="button outline" data-kind="ready" aria-pressed="false">Ready to Get Started</button>
</div><div class="inbox-filters"><label class="search-field">Search requests<input id="search" type="search" maxlength="160" placeholder="Name, email or company" autocomplete="off"></label><label>Status<select id="status"><option value="all">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option></select></label></div><div id="requests" aria-live="polite"></div><div class="pagination"><button class="button outline" id="previous">← Previous</button><span id="page-number"></span><button class="button outline" id="next">Next →</button></div></section><p id="admin-status" role="status">Checking your session…</p></main></body></html>
